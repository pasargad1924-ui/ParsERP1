name: Build ParsERP Windows EXE

on:
  push:
    branches:
      - main
      - grok-v0.3
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ParsERP/ParsERP.csproj

      - name: Build Release
        run: dotnet build ParsERP/ParsERP.csproj --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish ParsERP/ParsERP.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter ParsERP.exe -File
          if (-not $exe) {
            Get-ChildItem publish -Recurse | Format-Table FullName, Length
            throw "ParsERP.exe was not generated."
          }
          Write-Host "Created $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsERP-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
