name: Build ParsERP Windows Installer

on:
  push:
    branches:
      - grok-v0.7
      - grok-v0.8
      - grok-v0.9
      - grok-v1.1
      - grok-v1.3
    paths:
      - 'ParsERP/**'
      - 'ParsERP.Core/**'
      - 'Database/**'
      - 'Installer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows x64 Setup
    runs-on: windows-latest

    steps:
      - name: Checkout ParsERP source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'ParsERP/ParsERP.csproj'
          $appVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw 'Version is missing in ParsERP.csproj' }
          $iss = Get-Content 'Installer/ParsERP.iss' -Raw
          if ($iss -notmatch '#define MyAppVersion "([^"]+)"') { throw 'MyAppVersion is missing in Installer/ParsERP.iss' }
          $installerVersion = $Matches[1]
          if ($installerVersion -ne $appVersion) {
            throw "Version mismatch: project=$appVersion installer=$installerVersion. Update both to the same release version."
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Building ParsERP $appVersion"

      - name: Restore dependencies
        run: dotnet restore ParsERP/ParsERP.csproj

      - name: Publish self-contained Windows x64 application
        run: >
          dotnet publish ParsERP/ParsERP.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify published application
        shell: pwsh
        run: |
          $exe = Get-Item 'publish/ParsERP.exe' -ErrorAction Stop
          if ($exe.Length -le 0) { throw 'ParsERP.exe is empty.' }
          Write-Host "Published $($exe.FullName) ($($exe.Length) bytes)"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc 'Installer/ParsERP.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem 'Installer/Output' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE was not generated.' }
          Write-Host "Created installer: $($setup.FullName) ($($setup.Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ParsERP-Setup-v${{ steps.version.outputs.app_version }}-win-x64
          path: Installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Releases
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/grok-v0.') || github.ref == 'refs/heads/grok-v1.1' || github.ref == 'refs/heads/grok-v1.3')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parserp-v${{ steps.version.outputs.app_version }}-build-${{ github.run_number }}
          name: ParsERP v${{ steps.version.outputs.app_version }} Setup ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Windows x64 Setup Wizard installer for ParsERP ${{ steps.version.outputs.app_version }}.
          prerelease: true
          files: Installer/Output/*.exe
