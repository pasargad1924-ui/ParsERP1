name: Build ParsERP Windows EXE

on:
  push:
    branches:
      - main
      - grok-v.4
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ParsERP/ParsERP.csproj

      - name: Build Release
        run: dotnet build ParsERP/ParsERP.csproj --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish ParsERP/ParsERP.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter ParsERP.exe -File
          if (-not $exe) {
            Get-ChildItem publish -Recurse | Format-Table FullName, Length
            throw "ParsERP.exe was not generated."
          }
          Write-Host "Created $($exe.FullName) ($($exe.Length) bytes)"

      - name: Publish EXE to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/grok-v.4'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parserp-v0.4-build-${{ github.run_number }}
          name: ParsERP grok-v.4 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Automated Windows x64 build from branch grok-v.4.
          prerelease: true
          files: publish/ParsERP.exe
