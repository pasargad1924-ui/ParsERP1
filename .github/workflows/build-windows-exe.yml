name: Build ParsERP Windows EXE

on:
  push:
    branches:
      - main
      - grok-v0.2
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ParsERP/ParsERP.csproj

      - name: Build Release
        run: dotnet build ParsERP/ParsERP.csproj --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: >
          dotnet publish ParsERP/ParsERP.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter ParsERP.exe -File
          if (-not $exe) {
            Get-ChildItem publish -Recurse | Format-Table FullName, Length
            throw "ParsERP.exe was not generated."
          }
          Write-Host "Created $($exe.FullName) ($($exe.Length) bytes)"

      - name: Publish EXE as a GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          $tag = "grok-v0.2-build-$env:GITHUB_RUN_ID"
          gh release create $tag "publish/ParsERP.exe" --repo $env:GITHUB_REPOSITORY --title "ParsERP Grok v0.2 - Build $env:GITHUB_RUN_NUMBER" --notes "Self-contained Windows x64 EXE built from branch grok-v0.2 at commit $env:GITHUB_SHA." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation/upload failed." }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq "ParsERP.exe" }
          if (-not $asset) { throw "Release created but ParsERP.exe asset was not found." }
          Write-Host "Release URL: $($release.url)"
          Write-Host "EXE asset: $($asset.url) ($($asset.size) bytes)"

      - name: Upload Windows x64 artifact (optional if Actions storage is available)
        uses: actions/upload-artifact@v7
        with:
          name: ParsERP-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 1
        continue-on-error: true
