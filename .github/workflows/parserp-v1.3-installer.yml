name: ParsERP 1.3 Windows Installer

on:
  push:
    branches:
      - grok-v1.3
    paths:
      - "ParsERP/**"
      - "ParsERP.Core/**"
      - "Database/**"
      - "Installer/**"
      - ".github/workflows/parserp-v1.3-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ParsERP 1.3
        uses: actions/checkout@v4
        with:
          ref: grok-v1.3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "ParsERP/ParsERP.csproj"
          $appVersion = [string]$project.Project.PropertyGroup.Version
          $iss = Get-Content "Installer/ParsERP.iss" -Raw
          if ($appVersion -ne "1.3.0") { throw "Expected project version 1.3.0, got $appVersion" }
          if ($iss -notmatch '#define MyAppVersion "1.3.0"') { throw "Installer version must be 1.3.0" }

      - name: Restore
        run: dotnet restore ParsERP/ParsERP.csproj

      - name: Publish self-contained Windows x64
        run: dotnet publish ParsERP/ParsERP.csproj --configuration Release --runtime win-x64 --self-contained true --output publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false

      - name: Verify application output
        shell: pwsh
        run: |
          if (!(Test-Path "publish/ParsERP.exe")) { throw "ParsERP.exe was not produced" }
          if ((Get-Item "publish/ParsERP.exe").Length -lt 1MB) { throw "ParsERP.exe is unexpectedly small" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows Setup Wizard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" "/Oinstaller-output" "Installer/ParsERP.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer-output/ParsERP_Setup_1.3.0.exe")) { throw "Installer output not found" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ParsERP-1.3.0-Windows-x64-Setup
          path: installer-output/ParsERP_Setup_1.3.0.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: parserp-v1.3.0
          name: ParsERP 1.3.0 - Windows Installer
          body: |
            ParsERP version 1.3.0
            - Self-contained Windows x64 application
            - Standard Inno Setup Wizard installer
            - Desktop shortcut option
            - Uninstaller registration in Windows Installed Apps / Control Panel
          files: installer-output/ParsERP_Setup_1.3.0.exe
          draft: false
          prerelease: false
